name: run

on:
  workflow_dispatch:
  push:
  schedule:
    # UTC 13:00 = Beijing 21:00; GitHub scheduling may be delayed.
    - cron: '0 13 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          NOTIFY: ${{ secrets.NOTIFY }}
